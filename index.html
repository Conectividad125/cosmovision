<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cosmovisión Galáctica · Sergio Soto Zuleta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#002B5C;font-family:'Courier New',monospace;color:#E0E0E0}

#sec{position:fixed;inset:0;background:radial-gradient(circle,#001A3D,#000A1F);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px}
.box{border:2px solid #00E5FF;padding:22px;background:rgba(0,0,0,.92);border-radius:8px;max-width:520px;width:100%;text-align:center;box-shadow:0 0 30px rgba(0,229,255,.4)}
.box h3{color:#00E5FF;font-size:13px;margin-bottom:10px}
.box p{font-size:10px;color:#E0E0E0;margin-bottom:14px;line-height:1.5}
#pass,#pass2{width:100%;padding:12px;...
#unlock{background:#00AFFF;color:#000;border:none;padding:12px;font-weight:bold;cursor:pointer;width:100%;font-family:inherit;font-size:12px;border-radius:3px}
#msg{margin-top:10px;font-size:11px;min-height:18px;color:#FF0033}
#msg.ok{color:#00FF66}

#radar-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;background:#002B5C;z-index:1}
</style>
</head>
<body>

<div id="sec">
  <div class="box">
    <h3>TITULAR EXCLUSIVO DE PROPIEDAD INTELECTUAL</h3>
    <p>Protección de por vida · Derechos Morales y Patrimoniales Reservados<br>Titular: Sergio Soto Zuleta</p>
    <label style="display:block;text-align:left;font-size:10px;color:#00AFFF;margin-bottom:4px">🔐 Contraseña Principal:</label>
<input type="password" id="pass" maxlength="18" placeholder="Contraseña principal" autocomplete="off">
<label style="display:block;text-align:left;font-size:10px;color:#00FF66;margin:10px 0 4px 0">🔑 Clave de Recuperación:</label>
<input type="password" id="pass2" maxlength="30" placeholder="Clave secreta" autocomplete="off">
    <button id="unlock">[ DESBLOQUEAR SISTEMA ]</button>
    <div id="msg"></div>
  </div>
</div>

<canvas id="radar-canvas"></canvas>

<script>
'use strict';

var AUTH_KEY = 'COSMOVISION5678432';
var cv = document.getElementById('radar-canvas');
var cx = cv.getContext('2d');
var ASTROS = [
  {n:'Sol',         c:'#FFCC00', s:'☀',  t:'estrella', o:0,   p:0},
  {n:'Mercurio',    c:'#B8B8B8', s:'☿',  t:'planeta',  o:60,  p:87.969},
  {n:'Venus',       c:'#FFE9A8', s:'♀',  t:'planeta',  o:95,  p:224.701},
  {n:'Luna',        c:'#DDDDDD', s:'☾',  t:'satelite', o:130, p:27.321661},
  {n:'Tierra',      c:'#3B7DD8', s:'♁',  t:'planeta',  o:165, p:365.256},
  {n:'Marte',       c:'#D94B2B', s:'♂',  t:'planeta',  o:200, p:686.98},
  {n:'Júpiter',     c:'#D9A066', s:'♃',  t:'planeta',  o:245, p:4332.59},
  {n:'Saturno',     c:'#E0C97A', s:'♄',  t:'planeta',  o:285, p:10759.2},
  {n:'Urano',       c:'#7FE0E0', s:'♅',  t:'planeta',  o:320, p:30688.5},
  {n:'Neptuno',     c:'#4A6FFF', s:'♆',  t:'planeta',  o:350, p:60182},
  {n:'Plutón',      c:'#C0A080', s:'♇',  t:'planeta',  o:378, p:90560},
  {n:'Sol Sirio',   c:'#A0D8FF', s:'✦',  t:'estrella', o:410, p:1.0e6},
  {n:'Sol Alcyone', c:'#88BBFF', s:'✦',  t:'estrella', o:440, p:3.0e6},
  {n:'Sagitario A*',c:'#00AFFF', s:'⚫', t:'agujero',  o:470, p:1.0e8},
  {n:'Messier 87',  c:'#9933FF', s:'⚫', t:'agujero',  o:500, p:5.0e8},
  {n:'Sol Phoenix', c:'#FF007F', s:'⚫', t:'agujero',  o:530, p:1.0e9},
  {n:'TON 618',     c:'#FFFF00', s:'⚫', t:'agujero',  o:560, p:2.0e10}
];
  var _ep = Date.parse('1962-02-04T14:30:00-05:00');
var S = { tSec: (Date.now() - _ep)/1000 };
function resize(){
cv.width = window.innerWidth;
cv.height = window.innerHeight;  
}
window.addEventListener('resize', resize);

function draw(){
  var esc = Math.min(W,H) / 2000;
  var W = cv.width, H = cv.height;
  var CX = W/2, CY = H/2;

  cx.fillStyle = '#002B5C';
  cx.fillRect(0,0,W,H);

  cx.beginPath();
  cx.arc(CX, CY, 12, 0, Math.PI*2);
  cx.fillStyle = '#FFCC00';
  cx.fill();

  var t = S.tSec;
for(var i=0; i<ASTROS.length; i++){
  var a = ASTROS[i];
  if(a.o === 0){ continue; }
  cx.arc(CX, CY, a.o*esc, 0, Math.PI*2);
  cx.arc(CX, CY, a.o, 0, Math.PI*2);
  cx.strokeStyle = a.c + '40';
  cx.lineWidth = 1;
  cx.stroke();
var _p = a.p > 0 ? a.p : 1e6;
var ang = a.p === 0 ? 0 : -(2*Math.PI*(t/86400/_p));
if(i >= 11) ang += (i - 11) * Math.PI / 3;
var ax = CX + Math.cos(ang)*a.o*esc;
 var ay = CY + Math.sin(ang)*a.o*esc;
  cx.beginPath();
  cx.arc(ax, ay, 5, 0, Math.PI*2);
  cx.fillStyle = a.c;
  cx.fill();
  cx.fillStyle = '#E0E0E0';
  cx.font = '10px monospace';
  cx.textAlign = 'center';
  cx.fillText(a.s, ax, ay-8);
}

  requestAnimationFrame(draw);
}

document.getElementById('unlock').addEventListener('click', function(){
  var val = document.getElementById('pass').value;
var val2 = document.getElementById('pass2').value;
  var msg = document.getElementById('msg');
if(val === AUTH_KEY || val2 === 'centrogalactico'){
    msg.className = 'ok';
    msg.textContent = '✔ Acceso concedido';
    setTimeout(function(){
      document.getElementById('sec').style.display = 'none';
      resize();
      draw();
    }, 500);
  } else {
    msg.className = '';
    msg.textContent = '✘ Contraseña incorrecta';
  }
});

setTimeout(function(){ resize(); }, 500);
</script>
</body>
</html>
