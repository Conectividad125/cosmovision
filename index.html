<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cosmovisión Galáctica · Sergio Soto Zuleta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#002B5C;font-family:'Courier New',monospace;color:#E0E0E0}

#sec{position:fixed;inset:0;background:radial-gradient(circle,#001A3D,#000A1F);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px}
.box{border:2px solid #00E5FF;padding:22px;background:rgba(0,0,0,.92);border-radius:8px;max-width:520px;width:100%;text-align:center;box-shadow:0 0 30px rgba(0,229,255,.4)}
.box h3{color:#00E5FF;font-size:13px;margin-bottom:10px}
.box p{font-size:10px;color:#E0E0E0;margin-bottom:14px;line-height:1.5}
#pass{width:100%;padding:12px;background:#000B1A;border:1px solid #E0E0E0;color:#fff;font-size:16px;letter-spacing:3px;text-align:center;font-family:inherit;border-radius:3px;margin-bottom:12px}
#unlock{background:#00AFFF;color:#000;border:none;padding:12px;font-weight:bold;cursor:pointer;width:100%;font-family:inherit;font-size:12px;border-radius:3px}
#msg{margin-top:10px;font-size:11px;min-height:18px;color:#FF0033}
#msg.ok{color:#00FF66}

#radar-canvas{width:100%;height:100vh;display:block;background:#002B5C}
</style>
</head>
<body>

<div id="sec">
  <div class="box">
    <h3>TITULAR EXCLUSIVO DE PROPIEDAD INTELECTUAL</h3>
    <p>Protección de por vida · Derechos Morales y Patrimoniales Reservados<br>Titular: Sergio Soto Zuleta</p>
    <label style="display:block;text-align:left;font-size:10px;color:#00AFFF;margin-bottom:4px">🔐 Contraseña Principal:</label>
<input type="password" id="pass" maxlength="18" placeholder="Contraseña principal" autocomplete="off">
<label style="display:block;text-align:left;font-size:10px;color:#00FF66;margin:10px 0 4px 0">🔑 Clave de Recuperación:</label>
<input type="password" id="pass2" maxlength="30" placeholder="Clave secreta" autocomplete="off">
    <button id="unlock">[ DESBLOQUEAR SISTEMA ]</button>
    <div id="msg"></div>
  </div>
</div>

<canvas id="radar-canvas"></canvas>

<script>
'use strict';

var AUTH_KEY = 'COSMOVISION5678432';
var cv = document.getElementById('radar-canvas');
var cx = cv.getContext('2d');

function resize(){
  cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
}
window.addEventListener('resize', resize);

function draw(){
  var W = cv.width, H = cv.height;
  var CX = W/2, CY = H/2;

  cx.fillStyle = '#002B5C';
  cx.fillRect(0,0,W,H);

  cx.beginPath();
  cx.arc(CX, CY, 12, 0, Math.PI*2);
  cx.fillStyle = '#FFCC00';
  cx.fill();

  for(var i=1; i<=5; i++){
    cx.beginPath();
    cx.arc(CX, CY, i*60, 0, Math.PI*2);
    cx.strokeStyle = 'rgba(0,229,255,.3)';
    cx.stroke();
  }

  requestAnimationFrame(draw);
}

document.getElementById('unlock').addEventListener('click', function(){
  var val = document.getElementById('pass').value;
var val2 = document.getElementById('pass2').value;
  var msg = document.getElementById('msg');
if(val === AUTH_KEY || val2 === 'centrogalactico'){
    msg.className = 'ok';
    msg.textContent = '✔ Acceso concedido';
    setTimeout(function(){
      document.getElementById('sec').style.display = 'none';
      resize();
      draw();
    }, 500);
  } else {
    msg.className = '';
    msg.textContent = '✘ Contraseña incorrecta';
  }
});

resize();
</script>
</body>
</html>
